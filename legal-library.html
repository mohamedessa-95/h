<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة القوانين المصرية</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.top{background:#18324a;color:#fff;padding:18px 22px}.top h1{margin:0 0 8px}.wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px #0001}.law{padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0;cursor:pointer}.law.active{border-color:#18324a;background:#eef4f8}.search{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-bottom:10px}.article{border-top:1px solid #eee;padding:16px 0}.muted{color:#68737d;font-size:13px}.copy{padding:8px 12px;border:0;border-radius:7px;cursor:pointer}.badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#edf2f5;font-size:12px;margin:3px}.notice{background:#fff7df;border:1px solid #efd27a;padding:10px;border-radius:8px;margin:10px 0}.source{font-size:12px;color:#59636d}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{padding:9px 12px;border:1px solid #ccd4da;background:#fff;border-radius:8px;cursor:pointer}.empty{padding:20px;text-align:center}.count{font-size:13px;color:#667}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:#f7f9fa;border:1px solid #e1e6ea;padding:9px 12px;border-radius:8px}.open{display:inline-block;padding:8px 12px;background:#18324a;color:#fff;text-decoration:none;border-radius:7px}.law small{display:block;color:#7b858d;margin-top:5px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><h1>⚖️ مكتبة القوانين المصرية</h1><div>بحث باسم القانون أو رقمه أو سنة الإصدار أو رقم المادة أو كلمة داخل النصوص الموثقة — مكتبة تشريعية موسعة</div></div>
<div class="wrap"><aside class="card"><input id="lawSearch" class="search" placeholder="اسم القانون أو الرقم أو السنة"><div id="catalogCount" class="count"></div><div id="laws"></div></aside>
<main class="card"><input id="articleSearch" class="search" placeholder="رقم المادة أو كلمة داخل النص"><div class="toolbar"><button onclick="showAll()">كل المواد المطابقة</button><button onclick="clearArticleSearch()">مسح البحث</button></div><div id="meta"></div><div id="articles"></div></main></div>
<script>
let laws=[],arts=[],selected=null;
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
async function load(){laws=await (await fetch('legal_library/laws.json')).json();arts=await (await fetch('legal_library/articles.json')).json();renderLaws();select(laws[0]?.id)}
function renderLaws(){let q=norm($('lawSearch').value.trim());let list=laws.filter(x=>!q||norm(x.name+' '+x.number+' '+x.year+' '+x.category).includes(q));$('catalogCount').textContent=`إجمالي فهرس القوانين: ${laws.length} قانونًا/تشريعًا`; $('laws').innerHTML=list.map(x=>`<div class="law ${selected===x.id?'active':''}" onclick="select('${x.id}')"><b>${x.name}</b><div class="muted">قانون ${x.number} لسنة ${x.year}</div><span class="badge">${x.category}</span><span class="badge">${x.status}</span></div>`).join('')||'<div class="empty muted">لا توجد قوانين مطابقة</div>'}
function select(id){selected=id;renderLaws();let l=laws.find(x=>x.id===id);let total=arts.filter(x=>x.law_id===id).length;$('meta').innerHTML=`<h2>${l.name}</h2><div class="muted">رقم ${l.number} لسنة ${l.year} — الحالة: ${l.status}</div><div class="stats"><div class="stat"><b>المواد المثبتة:</b> ${total}</div><div class="stat"><b>آخر مراجعة:</b> ${l.last_checked||'—'}</div><div class="stat"><b>المصدر:</b> ${l.source_label}</div></div><div class="toolbar"><a class="open" target="_blank" href="${l.source}">فتح المصدر</a></div>${l.note?`<div class="notice">${l.note}</div>`:''}<div class="notice">تنبيه: البرنامج يعرض فقط النصوص التي تم إدخالها والتحقق من مصدرها. لا يتم اختلاق أو استكمال مواد غير موثقة.</div>`;renderArticles()}
function renderArticles(){let q=norm($('articleSearch').value.trim());let a=arts.filter(x=>x.law_id===selected&&(!q||norm(String(x.article)).includes(q)||norm(x.text).includes(q)));$('articles').innerHTML=`<div class="count">عدد المواد المثبتة المطابقة: ${a.length}</div>`+(a.length?a.map(x=>`<div class="article"><h3>المادة ${x.article}</h3><p>${escapeHtml(x.text)}</p><div class="source">المصدر المثبت: ${x.verified_source||'غير محدد'}</div><br><button class="copy" onclick='copyText(${JSON.stringify(x.text)})'>نسخ النص</button></div>`).join(''):'<p class="empty muted">لا توجد مادة مطابقة في البيانات المثبتة حاليًا. لم تتم إضافة نصوص غير موثقة بالتخمين.</p>')}
function showAll(){ $('articleSearch').value=''; renderArticles() }
function clearArticleSearch(){ $('articleSearch').value=''; renderArticles() }
function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('تم نسخ نص المادة'))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('lawSearch').oninput=renderLaws;$('articleSearch').oninput=renderArticles;load();
</script></body></html>
